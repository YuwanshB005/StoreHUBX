name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: StoreHUBXBackend
    services:
      mongodb:
        image: mongo:7
        ports: ["27017:27017"]
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
    env:
      # Fail instead of skipping when the test infrastructure is missing.
      STOREHUBX_REQUIRE_INFRA: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: StoreHUBXBackend/go.mod
          cache-dependency-path: StoreHUBXBackend/go.sum
      - name: Start MinIO
        # Service containers can't pass a command, so MinIO runs as a step.
        run: |
          docker run -d --name minio -p 9000:9000 \
            -e MINIO_ROOT_USER=minioadmin -e MINIO_ROOT_PASSWORD=minioadmin \
            quay.io/minio/minio server /data
          for i in $(seq 1 30); do curl -sf http://localhost:9000/minio/health/live && break; sleep 1; done
      - name: Pull build sandbox image
        run: docker pull node:22-bookworm-slim
      - name: Vet
        run: go vet ./...
      - name: Test
        # -p 1: the integration package owns a shared test database.
        run: go test -race -p 1 -count=1 ./...

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: StoreHUBClient
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: StoreHUBClient/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit
