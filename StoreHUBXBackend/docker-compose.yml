services:

  mongodb:
    image: mongo:latest
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db

  # S3-compatible object storage for built bundles. RustFS replaces MinIO,
  # which no longer publishes public container images. The API talks to it
  # through the standard S3 API, so any S3 server works here.
  rustfs:
    image: rustfs/rustfs:latest
    command: server /data
    environment:
      - RUSTFS_ACCESS_KEY=minioadmin
      - RUSTFS_SECRET_KEY=minioadmin
      - RUSTFS_CONSOLE_ENABLE=true
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # web console
    volumes:
      - rustfs_data:/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

volumes:
  mongodb_data:
  rustfs_data:
